<style>
    /* Flat boxes: square buttons app-wide (overrides inline radius); icons, avatars and pills keep their round shape.
       Only the Home and Reports > Investment summary boxes (.money-box) are rounded. */
    button, label:has(> input[type="file"]) { border-radius: 0 !important; }
    .money-box { border-radius: 16px !important; overflow: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #main {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    body {
        background: #f7f7fc;
        font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
    }
    /* iOS date inputs ignore width:100% and push the page wider than the screen */
    input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; }
    /* Scrolling flex columns: children keep their height instead of shrinking to fit */
    .scroll-col > * { flex-shrink: 0; }
</style>
